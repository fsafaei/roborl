[project]
name = "roborl"
version = "0.1.0"
description = "Learning RL for robotics by building it — verified against reference baselines."
readme = "README.md"
license = "MIT"
authors = [{ name = "Farhad Safaei" }]
requires-python = ">=3.10,<3.14"
dependencies = [
  "gymnasium[classic-control]>=1.0",
  "numpy>=1.26",
  "torch>=2.4",
  "tyro>=0.9",
  "wandb>=0.19",
  # RecordVideo's backend: Gymnasium 1.3 still imports moviepy directly.
  "moviepy>=1.0",
]

[project.optional-dependencies]
# cpu / cu130 select the torch wheel source (see [tool.uv.sources]); a plain
# `uv sync` uses PyPI wheels, which are CUDA-enabled on Linux and MPS-enabled
# on Apple Silicon. `--extra cpu` gives lean CPU-only wheels (CI, CPU boxes).
cpu = ["torch>=2.4"]
cu130 = ["torch>=2.4"]
mujoco = ["gymnasium[mujoco]>=1.0"]
box2d = ["gymnasium[box2d]>=1.0"]  # needs swig at build time — see docs/setup.md
benchmark = [
  "matplotlib>=3.8",
  "pandas>=2.2",
  "pyarrow>=16",
  "wandb-workspaces>=0.4.9",
]
# Gymnasium-Robotics Fetch tasks (HER). mujoco 3.12.0 broke its joint-type
# enum comparison (set_joint_qpos asserts on every Fetch reset); <3.12 works.
fetch = ["gymnasium-robotics>=1.4.2", "mujoco<3.12"]

[dependency-groups]
dev = [
  "ruff>=0.16",
  "mypy>=1.14",
  "pytest>=9",
  "pytest-cov>=6",
  "pre-commit>=4",
  "pandas-stubs>=2.2",
]

[project.scripts]
roborl = "roborl.cli:main"

[project.urls]
Repository = "https://github.com/fsafaei/roborl"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roborl"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
  "RUF", # ruff-specific
  "D",   # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; docstrings are optional there.
"tests/**" = ["D"]

[tool.mypy]
# No python_version pin: numpy 2.x stubs use PEP 695 syntax that mypy rejects
# when told to check as 3.10. We type-check under the venv interpreter (3.12,
# matching CI's quality job); 3.10 compatibility is enforced by ruff's
# target-version and the CI test matrix.
mypy_path = "src"
packages = ["roborl"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# moviepy ships no type stubs.
module = ["moviepy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# gymnasium-robotics ships no py.typed marker.
module = ["gymnasium_robotics.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast, isolated tests of a single component",
  "smoke: short end-to-end runs proving the pipeline works on CPU",
  "slow: long-running tests excluded from CI",
]
# Default to the fast suite; `make test-all` runs everything with `-m ""`.
addopts = "-m 'unit or smoke'"
# pytest 9: set strictness as ini options, not addopts (pytest#14442).
strict_markers = true
strict_config = true
